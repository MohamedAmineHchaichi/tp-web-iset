<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Exercice 4</title>
    <style>
        ol { list-style-type: decimal; }
        fieldset { margin-bottom: 4px; }
        td { vertical-align: bottom; }
    </style>
</head>
<body>
<form action="traitement.php" method="post">
    <fieldset>
        <legend>Votre identité</legend>
        <ol>
            <li><label >Nom</label> <input type="text"  placeholder="Prénom et nom" /></li>
            <li><label >Email</label> <input type="email"  placeholder="exemple@domaine.com" /></li>
            <li><label >Téléphone</label> <input type="tel"  placeholder="par ex : +3375500000000" /></li>
        </ol>
    </fieldset>

    <fieldset>
        <legend>Adresse de livraison</legend>
        <ol>
            <li><label >Adresse</label> <textarea   rows="5" cols="20"></textarea></li>
            <li><label >Code postal</label> <input type="text"  /></li>
            <li><label >Pays</label> <input type="text"  /></li>
        </ol>
    </fieldset>

    <fieldset>
        <legend>informations CB</legend>
        <ol>
            <li>
                <fieldset>
                    <legend>Type de carte bancaire</legend>
                    <ol>
                        <li><input type="radio" name="carte" /><label >VISA</label></li>
                        <li><input type="radio" name="carte" /><label >AmEx</label></li>
                        <li><input type="radio" name="carte"  /><label >Mastercard</label></li>
                    </ol>
                </fieldset>
            </li>
            <li><label >N° de carte</label> <input type="text"  /></li>
            <li><label >Code sécurité</label> <input type="text"  /></li>
            <li><label >Nom du porteur</label> <input type="text"  placeholder="Même nom que sur la carte" /></li>
        </ol>
    </fieldset>

    <fieldset>
        <input type="submit" value="J'achète !" />
    </fieldset>
</form>
</body>
</html>
